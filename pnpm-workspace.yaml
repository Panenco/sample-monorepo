packages:
  - 'apps/*'
  - 'packages/*'

# Wait one day before installing a freshly published version, so a release that gets yanked is skipped.
minimumReleaseAge: 1440

onlyBuiltDependencies:
  - '@prisma/engines'
  - '@swc/core'
  - esbuild
  - prisma

ignoredBuiltDependencies:
  - '@scarf/scarf'

peerDependencyRules:
  allowedVersions:
    nestjs-zod>@nestjs/common: '12'
    nestjs-zod>@nestjs/swagger: '12'

overrides:
  # CVE-2026-118764 (fixed in minimatch 11.0.1); typescript-eslint still asks for minimatch 10.
  '@typescript-eslint/typescript-estree>minimatch': ^11.0.1
